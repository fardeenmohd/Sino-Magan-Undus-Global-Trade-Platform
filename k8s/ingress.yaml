apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sino-magan-ingress
  namespace: sino-magan-trade
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          - path: /compute
            pathType: Prefix
            backend:
              service:
                name: compute-service
                port:
                  number: 8000
